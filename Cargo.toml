[package]
name = "trax-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Watch every Claude Code, Codex and other coding-agent CLI session from one terminal"
license = "MIT"
repository = "https://github.com/ielbadisy/trax"
homepage = "https://github.com/ielbadisy/trax"
readme = "README.md"
keywords = ["claude", "codex", "tui", "cli", "agents"]
categories = ["command-line-utilities"]
exclude = ["docs/", ".github/"]

[[bin]]
name = "trax"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"
crossterm = "0.29.0"
unicode-width = "0.2.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
portable-pty = "0.9.0"
vt100 = "0.18.1"
libc = "0.2.191"
